name: Update README content index

on:
  push:
    branches: [main]
    paths:
      - 'data/**/*_keyframes.md'
      - 'scripts/generate_readme_index.py'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Install Node (yt-dlp JS challenge runtime)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate README content index
        run: python scripts/generate_readme_index.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md data/.video_metadata.json
          git diff --cached --quiet || git commit -m "chore: refresh README content index [skip ci]"
          git push
